        - 07-demand-pricing-and-llm-agents/02-price-experiments.qmd
        - 07-demand-pricing-and-llm-agents/03-structural-vs-experimental.qmd
        - 07-demand-pricing-and-llm-agents/04-wtp-and-conjoint.qmd
        - 07-demand-pricing-and-llm-agents/05-llm-synthetic-respondents.qmd

    - part: "XIII — Long-Term Effects & Surrogates"
