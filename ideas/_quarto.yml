        - 04-sequential-anytime-valid/01-the-peeking-problem.qmd
        - 04-sequential-anytime-valid/02-group-sequential.qmd
        - 04-sequential-anytime-valid/03-msprt.qmd
        - 04-sequential-anytime-valid/04-confidence-sequences.qmd
        - 04-sequential-anytime-valid/05-e-values-and-betting.qmd
        - 04-sequential-anytime-valid/06-bayesian-ab.qmd

    - part: "V — Modern Causal ML (Unconfoundedness)"
