        - 09-long-term-and-surrogates/02-surrogate-index.qmd
        - 09-long-term-and-surrogates/03-downstream-proxy-metrics.qmd

    - part: "XIV — Personalization & Platform Craft"
      chapters:
        - 08-personalization-and-platform-craft/01-contextual-bandits.qmd
        - 08-personalization-and-platform-craft/02-post-adaptive-inference.qmd
        - 08-personalization-and-platform-craft/03-building-lyra.qmd
        - 08-personalization-and-platform-craft/04-the-estimator-interface.qmd
        - 08-personalization-and-platform-craft/05-scorecard-and-decisions.qmd

  appendices:
    - appendices/A-simulation-and-validation-vega.qmd
    - appendices/B-notation-and-estimand-glossary.qmd
    - appendices/C-tooling-and-environment.qmd

bibliography: references.bib
# csl: chicago-author-date.csl   # optional: drop a CSL file in to control style

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    code-link: true
    fig-width: 7
    fig-height: 4.5
  # PDF is optional; needs a LaTeX toolchain (quarto install tinytex).
  # Uncomment to enable a print edition.
  # pdf:
  #   documentclass: scrbook
  #   number-sections: true
  #   keep-tex: false

# Default execution engine is Jupyter (Python). Individual R chapters can opt in
# by adding `engine: knitr` to their YAML front matter.
engine: jupyter

execute:
  freeze: auto      # cache outputs; only re-run changed chapters
  echo: true
  warning: false
  message: false
