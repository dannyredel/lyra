project:
  type: book
  output-dir: _book

# ---------------------------------------------------------------------------
# Causal Experimentation — the "bridge book":
# causal inference as practiced INSIDE a modern experimentation platform.
# Organized by EXPERIMENTATION PROBLEM, not by method family.
# Doubles as the conceptual documentation for Lyra (platform) + Vega (DGP/sim).
#
# Two cross-cutting conventions every chapter follows (baked into the stubs):
#   1. Opens with "The platform problem" — what does this method solve in prod?
#   2. Ends with "Validate against ground truth (Vega)" — recover a known effect.
# ---------------------------------------------------------------------------

book:
  title: "Causal Experimentation"
  subtitle: "Causal inference as practiced inside a modern experimentation platform"
  author: "Daniel Redel"
  date: today
  search: true
  repo-url: https://github.com/dannyredel/causal-experimentation   # <- change
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "© Daniel Redel"
    right: "Built with [Quarto](https://quarto.org)"

  chapters:
    - index.qmd

    - part: "I — Foundations"
      chapters:
        - 00-foundational/01-experimentation-mindset.qmd
        - 00-foundational/02-potential-outcomes.qmd
        - 00-foundational/03-estimands.qmd
        - 00-foundational/04-randomization-and-identification.qmd
        - 00-foundational/05-statistics-review.qmd
        - 00-foundational/06-frequentist-vs-bayesian.qmd
        - 00-foundational/07-anatomy-of-a-platform.qmd

    - part: "II — The Core Readout"
      chapters:
        - 05-power-and-decisions/01-ate-three-ways.qmd
        - 05-power-and-decisions/02-variance-reduction.qmd
        - 05-power-and-decisions/03-ratio-metrics-and-delta.qmd
        - 05-power-and-decisions/04-cluster-robust-inference.qmd
        - 05-power-and-decisions/05-power-and-mde.qmd
        - 05-power-and-decisions/06-decision-framework.qmd

    - part: "III — Trustworthy Experiments"
      chapters:
        - 12-trustworthy-and-metrics/01-srm-and-diagnostics.qmd
        - 12-trustworthy-and-metrics/02-aa-testing.qmd
        - 12-trustworthy-and-metrics/03-multiple-comparisons.qmd
        - 12-trustworthy-and-metrics/04-metric-design-and-governance.qmd
        - 12-trustworthy-and-metrics/05-novelty-and-primacy.qmd
        - 12-trustworthy-and-metrics/06-winners-curse.qmd

    - part: "IV — Sequential & Always-Valid"
